name: marro

services:
  mysql:
    image: 'mysql:latest'
    container_name: db
    environment:
      - 'MYSQL_DATABASE=marro'
      - 'MYSQL_PASSWORD=password'
      - 'MYSQL_ROOT_PASSWORD=verysecretpassword'
      - 'MYSQL_USER=abdou'
    ports:
      - '3306:3306'
    networks:
      - marro-network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      MYSQL_ROOT_PASSWORD: verysecretpassword
    ports:
      - '8080:80'
    depends_on:
      - mysql
    networks:
      - marro-network

networks:
  marro-network:
    driver: bridge
